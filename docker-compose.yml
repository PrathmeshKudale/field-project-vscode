services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kaushalsetu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - kaushalsetu_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kaushalsetu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kaushalsetu_data:
